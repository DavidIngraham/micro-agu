[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microagu-control"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["microagu-sim[analysis]", "numpy>=1.24", "scipy>=1.10"]
license = "GPL-3.0-or-later"

[project.scripts]
microagu-sysid = "microagu_control.sysid.__main__:main"
microagu-tune = "microagu_control.pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
microagu-sim = { path = "../simulation/crates/sim-python" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
